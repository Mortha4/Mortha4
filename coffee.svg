<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180" role="img" aria-label="Taza de café con vapor animado" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .steam {
      fill: none;
      stroke: #b0a9a2;
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0;
      animation: rise 3s ease-in-out infinite;
    }
    .s2 { animation-delay: 0.8s; }
    .s3 { animation-delay: 1.6s; }
    @keyframes rise {
      0%   { transform: translateY(18px) scaleY(0.6); opacity: 0; }
      30%  { opacity: 0.85; }
      100% { transform: translateY(-22px) scaleY(1.1); opacity: 0; }
    }
    .cup { animation: bob 3s ease-in-out infinite; transform-origin: 100px 150px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1.5px); }
    }
    .coffee-shine { animation: shine 3s ease-in-out infinite; }
    @keyframes shine {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 0.55; }
    }
  </style>

  <!-- Vapor -->
  <g>
    <path class="steam s1" d="M80 80 C70 68, 90 58, 80 46"/>
    <path class="steam s2" d="M100 80 C90 68, 110 58, 100 46"/>
    <path class="steam s3" d="M120 80 C110 68, 130 58, 120 46"/>
  </g>

  <!-- Taza -->
  <g class="cup">
    <!-- Asa -->
    <path d="M148 98 C176 96, 176 134, 146 132" fill="none" stroke="#6f4e37" stroke-width="9" stroke-linecap="round"/>
    <!-- Cuerpo -->
    <path d="M52 92 H152 V120 C152 144, 134 156, 102 156 C70 156, 52 144, 52 120 Z" fill="#8b5e3c"/>
    <!-- Borde / café -->
    <ellipse cx="102" cy="92" rx="50" ry="9" fill="#5a3a22"/>
    <ellipse cx="102" cy="92" rx="44" ry="6" fill="#3b2314"/>
    <ellipse class="coffee-shine" cx="90" cy="91" rx="16" ry="2.2" fill="#c89a6a"/>
  </g>

  <!-- Plato -->
  <ellipse cx="102" cy="162" rx="68" ry="8" fill="#6f4e37"/>
  <ellipse cx="102" cy="159" rx="62" ry="6" fill="#a0724b"/>
</svg>
